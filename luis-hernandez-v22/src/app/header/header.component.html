<header>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <mat-toolbar class="header glass-surface">
    <nav mat-tab-nav-bar color="accent" [tabPanel]="tabPanel()" aria-label="Main navigation">
      @for (link of navLinks; track link.path) {
        <a
          mat-tab-link
          class="nav-link"
          [routerLink]="link.path"
          routerLinkActive
          #rla="routerLinkActive"
          [active]="rla.isActive"
          [attr.aria-current]="rla.isActive ? 'page' : null"
        >
          {{ link.label }}
        </a>
      }
    </nav>
  </mat-toolbar>
</header>
